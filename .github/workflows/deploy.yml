name: Sync Vimeo & Deploy

on:
  push:
    branches: [main]
  schedule:
    # 10:07 UTC = 5:07 AM en Miami (6:07 AM en horario de verano). GitHub puede retrasarlo.
    - cron: '7 10 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync videos from Vimeo
        if: github.event_name != 'push'
        run: node scripts/sync-vimeo.mjs
        env:
          VIMEO_ACCESS_TOKEN: ${{ secrets.VIMEO_ACCESS_TOKEN }}
          VIMEO_MUSIC_ALBUM_ID: ${{ secrets.VIMEO_MUSIC_ALBUM_ID }}
          VIMEO_PUBLICIDAD_ALBUM_ID: ${{ secrets.VIMEO_PUBLICIDAD_ALBUM_ID }}
          VIMEO_NARRATIVE_ALBUM_ID: ${{ secrets.VIMEO_NARRATIVE_ALBUM_ID }}
          VIMEO_REEL_ALBUM_ID: ${{ secrets.VIMEO_REEL_ALBUM_ID }}

      - name: Build
        run: npm run build
        env:
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL || 'https://johnnylion.com' }}
          # Con dominio propio el sitio cuelga de la raíz. Sin dominio, define la variable VITE_BASE como /JohnnyLionWeb/
          VITE_BASE: ${{ vars.VITE_BASE || '/' }}

      # El push del bot no dispara otros workflows, por eso el deploy va en esta misma ejecución.
      - name: Commit videos.json
        if: github.event_name != 'push'
        run: |
          if git diff --quiet -- src/data/videos.json; then
            echo "Sin cambios en videos.json."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/videos.json
          git commit -m "chore: sync Vimeo videos"
          git push

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - uses: actions/deploy-pages@v4
        id: deployment

