name: Sync Vimeo & Deploy

on:
  push:
    branches: [main]
  schedule:
    # GitHub retrasa o pierde crons puntuales. Se dispara cada hora (minuto 7, fuera de la hora pico) y el paso
    # "Check Miami time" deja pasar solo el primer disparo desde las 5:00 AM de Miami que aún no sincronizó hoy.
    - cron: '7 9-23 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Miami time
        id: miami
        run: |
          echo "date=$(TZ=America/New_York date +%F)" >> "$GITHUB_OUTPUT"
          echo "hour=$(TZ=America/New_York date +%H)" >> "$GITHUB_OUTPUT"

      # El marcador de "ya sincronizado hoy" es una entrada de caché; no genera commits.
      - name: Check sync done today
        id: done
        if: github.event_name == 'schedule'
        uses: actions/cache/restore@v4
        with:
          path: .sync-marker
          key: vimeo-sync-${{ steps.miami.outputs.date }}
          lookup-only: true

      - name: Check Miami time
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "$((10#${{ steps.miami.outputs.hour }}))" -lt 5 ]; then
              echo "Aún no son las 05:00 en Miami. Se omite."
              echo "run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "${{ steps.done.outputs.cache-hit }}" = "true" ]; then
              echo "Ya se sincronizó hoy. Se omite."
              echo "run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: npm ci

      - name: Sync videos from Vimeo
        if: steps.gate.outputs.run == 'true' && github.event_name != 'push'
        run: node scripts/sync-vimeo.mjs
        env:
          VIMEO_ACCESS_TOKEN: ${{ secrets.VIMEO_ACCESS_TOKEN }}
          VIMEO_MUSIC_ALBUM_ID: ${{ secrets.VIMEO_MUSIC_ALBUM_ID }}
          VIMEO_PUBLICIDAD_ALBUM_ID: ${{ secrets.VIMEO_PUBLICIDAD_ALBUM_ID }}
          VIMEO_NARRATIVE_ALBUM_ID: ${{ secrets.VIMEO_NARRATIVE_ALBUM_ID }}
          VIMEO_REEL_ALBUM_ID: ${{ secrets.VIMEO_REEL_ALBUM_ID }}

      - name: Build
        if: steps.gate.outputs.run == 'true'
        run: npm run build
        env:
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL || 'https://johnnylion.com' }}
          # Sin dominio propio el sitio cuelga de /JohnnyLionWeb/. Con dominio, define la variable VITE_BASE como /
          VITE_BASE: ${{ vars.VITE_BASE || '/JohnnyLionWeb/' }}

      # El push del bot no dispara otros workflows, por eso el deploy va en esta misma ejecución.
      - name: Commit videos.json
        if: steps.gate.outputs.run == 'true' && github.event_name != 'push'
        run: |
          if git diff --quiet -- src/data/videos.json; then
            echo "Sin cambios en videos.json."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/videos.json
          git commit -m "chore: sync Vimeo videos"
          git push

      - uses: actions/configure-pages@v5
        if: steps.gate.outputs.run == 'true'

      - uses: actions/upload-pages-artifact@v3
        if: steps.gate.outputs.run == 'true'
        with:
          path: dist

      - uses: actions/deploy-pages@v4
        id: deployment
        if: steps.gate.outputs.run == 'true'

      - name: Mark sync done today
        if: steps.gate.outputs.run == 'true' && github.event_name == 'schedule'
        run: date > .sync-marker

      - name: Save sync marker
        if: steps.gate.outputs.run == 'true' && github.event_name == 'schedule'
        uses: actions/cache/save@v4
        with:
          path: .sync-marker
          key: vimeo-sync-${{ steps.miami.outputs.date }}
